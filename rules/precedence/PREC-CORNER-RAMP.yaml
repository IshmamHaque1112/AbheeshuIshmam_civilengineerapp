id: PREC-CORNER-RAMP
question: Which rules apply to a corner ramp in the public right-of-way?
decision: ADA, NYC Administrative Code, Highway Rules and H-1011.
reason: The city design guide and the Highway Rules point to these for corner ramps.
  Building code limits are not used for the ramp.
source_section: 34 RCNY §2-09(f)(4)(xiv); NYC Street Design Manual
url: https://codelibrary.amlegal.com/codes/newyorkcity/latest/NYCrules/0-0-0-62402
