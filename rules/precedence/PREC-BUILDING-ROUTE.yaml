id: PREC-BUILDING-ROUTE
question: Which rule applies to a route from a sidewalk to a building?
decision: Flag NYC Building Code §1104 for engineer review.
reason: §1104.1 covers routes within a site. It is not a corner ramp limit.
source_section: NYC Building Code §1104.1
